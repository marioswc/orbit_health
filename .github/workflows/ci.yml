# Pruebas automáticas en los tres sistemas. Un fallo aquí que no ocurre en Linux es justo el tipo de problema que se reporta como
# "en Mac o en Windows no funciona": rutas, permisos, codificación de texto, procesos.
name: Pruebas
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   nombre: linux }
          - { os: windows-latest, nombre: windows }
          - { os: macos-latest,   nombre: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ORBIT_PRECALENTAR: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias
        run: pip install -r backend/requirements.txt
      - name: Pruebas del backend
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider
  frontend:
    name: frontend (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   nombre: linux }
          - { os: windows-latest, nombre: windows }
          - { os: macos-latest,   nombre: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias (npm ci falla si package-lock y package.json no coinciden)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Pruebas y compilación
        working-directory: frontend
        run: |
          npx vitest run
          npm run build
